<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="todoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle with gradient -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#todoGradient)" filter="url(#shadow)" />

  <!-- Inner subtle border -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" />

  <!-- Checkmark icon -->
  <path d="M160 262 L224 326 L352 186" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="42" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
