<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">


</head>
<body>
    <main class="todo-container">

    <header class="todo-header">
        <div class="header-top">
            <div class="header-text">
                <h1>My To Do List</h1>
                <p>Keep track of what needs to get done.</p>
            </div>
            <div id="authContainer" class="auth-container">
                <span id="syncBadge" class="sync-badge">● Checking status...</span>
                <button id="googleSignInBtn" class="google-sign-in-btn" type="button">
                    <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Sign in to Sync</span>
                </button>
                <div id="userProfile" class="user-profile" style="display: none;">
                    <img id="userAvatar" class="user-avatar" src="" alt="User" />
                    <div class="user-info">
                        <span id="userName" class="user-name"></span>
                    </div>
                    <button id="signOutBtn" class="sign-out-btn" type="button" title="Sign out">Sign out</button>
                </div>
            </div>
        </div>
    </header>

    <section class="counter">
        <button id="totalTasks" ></button>
        <button id="complete"></button>
        <button id="incomplete"></button>


    </section>

    <section class="task-input-section">

        <input
            id="task"
            type="text"
            placeholder="What needs to be done?"
            autocomplete="off"
        >
        <p id="taskError"></p>

        <div class="button-group">
            <button id="addButton" class="add-button">
                Add Task
            </button>

            <button id="clearallButton" class="clear-button">
                Clear All
            </button>
        </div>

    </section>

    <input 
    id="searchInput" 
    type="text" 
    placeholder="Search tasks..." 
    autocomplete="off"
>

    <section class="tasks-section">
        <ul id="taskList"></ul>
    </section>


</main>


<div id="editModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h2>Edit Task</h2>
        <input id="editTaskInput" type="text" placeholder="Update task title..." autocomplete="off">
        <p id="editTaskError"></p>

        <div class="modal-actions">
            <button id="cancelEditButton" class="modal-cancel-btn">Cancel</button>
            <button id="saveEditButton" class="modal-save-btn">Save Changes</button>
        </div>
    </div>
</div>

<div id="clearAllModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h2>Are you sure?</h2>
        <p>This action will delete all your existing tasks.</p>

        <div class="modal-actions">
            <button id="cancelClearAllButton" class="modal-cancel-btn">Cancel</button>
            <button id="confirmClearAllButton" class="modal-save-btn">Clear All</button>
        </div>
    </div>
</div>

<script type="module" src="script.js"></script>
    
</body>
</html>
